version: 2
semantic_model:
  name: pharma_commercial_command_centre
  description: >
    Semantic layer for the Pharma Commercial Command Centre (UC1: Leakage Signals, UC2: Journey Orchestration).
    The UI dashboard displays data from primary tables: Leakage_Activity, fatigue_score, leakage_history, and Compliance_Table.
    These are enriched during the data pipeline from reference tables: Product_Master, hcp_master, Zip_Geography_Master,
    Payer_Master, hcp_engagement_logs, campaign_master, and copay_Claims_Transactions.

  # ============================================================
  # PRIMARY UI TABLES — Data displayed directly on the dashboard
  # ============================================================
  sources:
    - name: mysql_local
      database: mcp_poc_db
      tables:

        # =====================================================
        # PRIMARY TABLE 1: Leakage Activity (Main UI Table)
        # =====================================================
        - name: Leakage_Activity
          description: >
            PRIMARY UI TABLE — Main Leakage Records Table rendered on the dashboard.
            Contains pre-enriched, aggregated pharmacy leakage metrics.
            HCP_Name, State, BrandName are ALREADY RESOLVED — no joins needed for basic leakage queries.
            Use for ALL leakage queries: leakage %, top leakage, rejections, leakage by zip/HCP/state.
            60 rows. States: AZ, CA, DC, FL, GA, IL, IN, NC, NV, NY, OH, PA, TX, WA.
          columns:
            - name: id
              type: primary_key
            - name: BrandName
              type: string
              description: "Drug brand name (pre-resolved from Product_Master during pipeline)"
            - name: Pharmacy_ID
              type: string
            - name: zip_code
              type: string
              references: Zip_Geography_Master.zip_code
            - name: Prescriber_NPI
              type: string
              references: hcp_master.Prescriber_NPI
            - name: HCP_Name
              type: string
              description: "Full physician name (pre-resolved from hcp_master during pipeline)"
            - name: State
              type: string
              description: "US state code (pre-resolved from Zip_Geography_Master during pipeline). Available: AZ, CA, DC, FL, GA, IL, IN, NC, NV, NY, OH, PA, TX, WA"
            - name: Pharmacy_Rejections
              type: integer
              description: "Number of rejections for this pharmacy-brand-HCP combination"
            - name: Total_Brand_Rejections
              type: integer
              description: "Total rejections across ALL pharmacies for this brand"
            - name: Leakage_Percentage
              type: decimal
              description: "Formula: (Pharmacy_Rejections / Total_Brand_Rejections) * 100"
            - name: generic_name
              type: string
            - name: manufacturer
              type: string
            - name: productid
              type: string
              references: Product_Master.product_id
            - name: Processed_TimeStamp
              type: timestamp
              description: "Data seeded around July 3, 2026"

        # =====================================================
        # PRIMARY TABLE 2: Fatigue Score (UI Fatigue Table)
        # =====================================================
        - name: fatigue_score
          description: >
            PRIMARY UI TABLE — Fatigue Records Table rendered on the dashboard.
            Pre-calculated HCP fatigue scores with ALREADY RESOLVED names.
            Contains HCP_Name, Product, Campaign_Name, and Fatigue DIRECTLY.
            DO NOT JOIN other tables. 49 rows. Fatigue range: 10-60.
          columns:
            - name: Fatigue_ID
              type: primary_key
            - name: HCP_Name
              type: string
              description: "Full physician name (pre-resolved)"
            - name: Fatigue
              type: decimal
              description: "Fatigue score 10-60. Higher = more fatigued. Average ~40."
            - name: Product
              type: string
              description: "Drug/product brand name (pre-resolved)"
            - name: Campaign_Name
              type: string
              description: "Marketing campaign name (pre-resolved)"
            - name: Processed_TimeStamp
              type: timestamp

        # =====================================================
        # PRIMARY TABLE 3: Leakage History (UI Threshold Log)
        # =====================================================
        - name: leakage_history
          description: >
            PRIMARY UI TABLE — Threshold Update Log displayed on the dashboard.
            Audit trail of leakage threshold value changes. 13 rows.
            ONLY for: leakage limit, leakage threshold, history of changes, who updated.
            Does NOT contain leakage percentage data.
          columns:
            - name: id
              type: primary_key
            - name: previous_value
              type: decimal
              description: "Old threshold value before change"
            - name: new_value
              type: decimal
              description: "New threshold value after change"
            - name: updated_by
              type: string
              description: "Admin user who made the change"
            - name: updated_at
              type: timestamp
              description: "Date range: Jun 24 - Jul 29, 2026"

        # =====================================================
        # PRIMARY TABLE 4: Compliance Table (UI KPI Card)
        # =====================================================
        - name: Compliance_Table
          description: >
            PRIMARY UI TABLE — Count displayed on KPI card (Govt. Plans Bypassed).
            Stores Medicaid/Medicare rejected claims excluded during compliance filtering.
            111 rows. Payer types: Medicaid , Medicare.
          columns:
            - name: id
              type: primary_key
            - name: Patient_Token
              type: string
            - name: Payer_id
              type: string
              references: Payer_Master.payer_id
            - name: Payer_Type
              type: string
              description: "Values: Medicaid, Medicare"
            - name: Created_At
              type: timestamp
              description: "Date range: Jul 3 - Jul 29, 2026"

        # =====================================================
        # TRANSACTION TABLE: Copay Claims (Primary claims data)
        # =====================================================
        - name: copay_Claims_Transactions
          description: >
            PRIMARY TRANSACTION TABLE — 713 rows of copay claims data.
            This is the MAIN claims table with rich data. Use for ALL copay queries,
            claim analysis, reject codes, claim amounts, payer analysis, and HCP claim profiles.
            Response_Status values: V=Verified(249), R=Rejected(237), A=Approved(227).
            Has denormalized HCP profile snapshot and successful joins to hcp_master, Payer_Master, and Reject_Code_Master.
          columns:
            - name: Transaction_ID
              type: primary_key
            - name: transaction_datetime
              type: timestamp
              description: "Data up to Jun 22, 2026"
            - name: Patient_Token
              type: string
            - name: Prescriber_NPI
              type: string
              references: hcp_master.Prescriber_NPI
            - name: Pharmacy_ID
              type: string
            - name: NDC_Code
              type: string
            - name: Payer_BIN
              type: string
            - name: Response_Status
              type: string
              description: "Values: V (Verified/249 rows), R (Rejected/237 rows), A (Approved/227 rows)"
            - name: zip_code
              type: string
              references: Zip_Geography_Master.zip_code
            - name: payer_id
              type: string
              references: Payer_Master.payer_id
            - name: product_id
              type: integer
              references: Product_Master.product_id
            - name: claim_status
              type: string
              description: "Values: PAID, REJECTED"
            - name: reject_code
              type: string
              references: Reject_Code_Master.reject_code
            - name: Reject_Message
              type: string
            - name: claim_amount
              type: decimal
            - name: BrandName
              type: string
              description: "Drug brand name (denormalized)"
            - name: HCP_Match_Status
              type: string
            - name: HCP_First_Name
              type: string
            - name: HCP_Last_Name
              type: string
            - name: HCP_Specialty
              type: string
              description: "Denormalized specialty from HCP profile"
            - name: HCP_State_License
              type: string
            - name: HCP_Practice_State
              type: string
            - name: HCP_Contact_Phone
              type: string
            - name: HCP_Secure_Fax
              type: string
            - name: HCP_Practice_Zip
              type: string

        # =====================================================
        # REFERENCE / ENRICHMENT TABLES
        # =====================================================
        - name: Product_Master
          description: "Reference table: Product catalog mapping NDC codes to brand names, generic names, product IDs, and manufacturers. 100 rows."
          columns:
            - name: ndc_code
              type: primary_key
              description: "National Drug Code (format: NDC00001)"
            - name: product_id
              type: integer
            - name: brand_name
              type: string
              description: "Commercial brand name (lowercase column name)"
            - name: generic_name
              type: string
            - name: manufacturer
              type: string

        - name: hcp_master
          description: "Reference table: Healthcare Provider directory. 103 rows. Practice states: TX, TN, KA. 18 specialties."
          columns:
            - name: id
              type: primary_key
            - name: Prescriber_NPI
              type: string
              description: "National Provider Identifier (format: 1000000XXX)"
            - name: hcp_firstName
              type: string
            - name: hcp_lastName
              type: string
            - name: specialty
              type: string
              description: "18 specialties: Cardiology, Dermatology, Endocrinology, Gastroenterology, General Medicine, Internal Medicine, Nephrology, Neurology, Obstetrics & Gynecology, Oncology, Ophthalmology, Orthopedics, Pediatrics, Psychiatry, Pulmonology, Radiology, Rheumatology, Urology"
            - name: state_license
              type: string
            - name: practice_state
              type: string
              description: "Available values: TX, TN, KA"
            - name: practice_zip
              type: string
            - name: phone
              type: string
            - name: secure_fax
              type: string
            - name: rep_id
              type: string
            - name: email
              type: string

        - name: Zip_Geography_Master
          description: "Reference table: Maps zip codes to city, county, and state. 23 rows."
          columns:
            - name: zip_code
              type: primary_key
            - name: city
              type: string
            - name: county
              type: string
            - name: state
              type: string

        - name: Payer_Master
          description: "Reference table: Insurance plan directory. 200 rows. Types: Commercial, Medicare, Medicaid."
          columns:
            - name: payer_id
              type: primary_key
            - name: payer_name
              type: string
            - name: payer_type
              type: string
              description: "Values: Commercial, Medicare, Medicaid"
            - name: region
              type: string

        - name: campaign_master
          description: "Reference table: Marketing campaign directory. 100 rows. 8 channels, 10 types, 4 statuses. Date range: Apr 1 - Sep 30, 2026."
          columns:
            - name: campaign_id
              type: primary_key
            - name: campaign_name
              type: string
            - name: campaign_type
              type: string
              description: "10 types: Pharmacy Education, HCP Engagement, Digital Nurture, Brand Awareness, Market Expansion, Patient Adherence, Payer Engagement, Product Launch, Patient Support, Disease Awareness"
            - name: campaign_category
              type: string
            - name: channel
              type: string
              description: "8 channels: Digital Ads, Email, Mobile App, Rep Visit, SMS, Social Media, Virtual Event, Webinar"
            - name: product_id
              type: integer
              references: Product_Master.product_id
            - name: brand_name
              type: string
            - name: target_audience
              type: string
            - name: target_specialty
              type: string
            - name: target_segment
              type: string
            - name: objective
              type: string
            - name: region
              type: string
            - name: start_date
              type: date
            - name: end_date
              type: date
            - name: budget_amount
              type: decimal
            - name: expected_reach
              type: integer
            - name: status
              type: string
              description: "Values: Active, Completed, Planned, Cancelled"
            - name: priority_level
              type: string
            - name: owner_name
              type: string
            - name: created_date
              type: timestamp
            - name: modified_date
              type: timestamp

        - name: hcp_engagement_logs
          description: "Reference table: Digital touchpoint logs per HCP. 42 rows. Channels: Email, Webinar. Date range: Jun 1-30, 2026."
          columns:
            - name: Log_ID
              type: primary_key
            - name: HCP_ID
              type: string
              references: hcp_master.Prescriber_NPI
            - name: Engagement_Date
              type: timestamp
            - name: Channel
              type: string
              description: "Values: Email, Webinar"
            - name: Email_Sent
              type: integer
            - name: Email_Opened
              type: integer
            - name: Email_Clicked
              type: integer
            - name: Webinar_Minutes
              type: integer
            - name: Campaign_ID
              type: string
              references: campaign_master.campaign_id

        - name: Reverse_Claims
          description: >
            Transaction log for reverse claim events. Currently only 1 row (test data).
            For robust claims analysis, prefer copay_Claims_Transactions (713 rows) instead.
          columns:
            - name: id
              type: primary_key
            - name: Transaction_ID
              type: string
            - name: Timestamp
              type: timestamp
            - name: Patient_Token
              type: string
            - name: Prescriber_NPI
              type: string
            - name: Pharmacy_ID
              type: string
            - name: NDC_Code
              type: string
            - name: Payer_BIN
              type: string
            - name: Response_Status
              type: string
            - name: Reject_Code
              type: string
            - name: Reject_Message
              type: string
            - name: Created_At
              type: timestamp

        - name: Reject_Code_Master
          description: "Reference table: Reject code directory. 200 rows. Severities: Critical, High, Medium, Low."
          columns:
            - name: reject_code
              type: primary_key
            - name: reject_description
              type: string
            - name: severity
              type: string
              description: "Values: Critical, High, Medium, Low"

        - name: territory_master
          description: "Reference table: Territory alignment master. 120 rows. 10 states, 6 segments."
          columns:
            - name: id
              type: primary_key
            - name: alignment_id
              type: string
            - name: effective_date
              type: date
            - name: territory_id
              type: string
            - name: rep_id
              type: string
            - name: state
              type: string
            - name: zip_prefix
              type: string
            - name: segment
              type: string
              description: "Values: Neurology, Gastroenterology, Immunology, Pulmonology, Cardiology, Dermatology"
            - name: priority_flag
              type: string
            - name: manager_name
              type: string
            - name: status
              type: string

        # =====================================================
        # UC3, UC4 & UC5 TABLES
        # =====================================================
        - name: hcp_master_details
          description: "Main UC3/UC5 table storing HCP records, work details, rep assignment, and Salesforce ID."
          columns:
            - name: hcp_id
              type: primary_key
            - name: Prescriber_NPI
              type: string
            - name: hcp_firstName
              type: string
            - name: hcp_lastName
              type: string
            - name: rep_id
              type: string
            - name: status
              type: string
            - name: work_detail
              type: text
            - name: sf_id
              type: string

        - name: hcp_master_workdetails_history
          description: "UC3 audit history trail table tracking updates to work details."
          columns:
            - name: history_id
              type: primary_key
            - name: hcp_id
              type: string
            - name: rep_id
              type: string
            - name: rep_firstName
              type: string
            - name: rep_lastName
              type: string
            - name: work_detail
              type: text
            - name: updated_datetime
              type: timestamp

        - name: Tablet_Extract_History
          description: "UC4 medicine extraction table storing extracted drug, dosage, frequency, and clinical guidance."
          columns:
            - name: id
              type: primary_key
            - name: Tablet_name
              type: string
            - name: Dosage
              type: string
            - name: Frequency
              type: string
            - name: guidance
              type: text
            - name: timestamp
              type: timestamp
            - name: Prescriber_NPI
              type: string
            - name: sf_id
              type: string
            - name: status
              type: string
            - name: message
              type: text

        - name: Transcript_Extraction_History
          description: "UC4 transcript extraction log storing original voice transcript text and extracted tablet names."
          columns:
            - name: id
              type: primary_key
            - name: hcp_detail_id
              type: integer
            - name: Prescriber_NPI
              type: string
            - name: sf_id
              type: string
            - name: transcript_text
              type: text
            - name: tablet_names
              type: string
            - name: status
              type: string
            - name: created_at
              type: timestamp

        - name: medicine_extraction_log
          description: "UC4 medicine extraction summary log with confidence scores and HCP details."
          columns:
            - name: extraction_id
              type: primary_key
            - name: hcp_detail_id
              type: integer
            - name: Prescriber_NPI
              type: string
            - name: HCP_Name
              type: string
            - name: extracted_drug
              type: string
            - name: brand_name
              type: string
            - name: generic_name
              type: string
            - name: dosage
              type: string
            - name: frequency
              type: string
            - name: confidence_score
              type: decimal
            - name: extracted_at
              type: timestamp

        - name: salesforce_sync_log
          description: "UC5 Salesforce CRM sync audit status log tracking sync status, Salesforce object/record ID, and messages."
          columns:
            - name: sync_id
              type: primary_key
            - name: hcp_detail_id
              type: integer
            - name: Prescriber_NPI
              type: string
            - name: HCP_Name
              type: string
            - name: sf_object_type
              type: string
            - name: sf_record_id
              type: string
            - name: sync_status
              type: string
            - name: sync_message
              type: text
            - name: synced_at
              type: timestamp

        - name: rep_details
          description: "Sales representative directory."
          columns:
            - name: rep_id
              type: primary_key
            - name: rep_firstName
              type: string
            - name: rep_lastName
              type: string
            - name: email
              type: string
            - name: phone
              type: string
            - name: manager_id
              type: string

        - name: rep_master
          description: "Sales manager directory."
          columns:
            - name: rep_id
              type: primary_key
            - name: rep_firstName
              type: string
            - name: rep_lastName
              type: string
            - name: email
              type: string
            - name: phone
              type: string

        # =====================================================
        # UC6: NEXT BEST ACTION (NBA) & COHORT INTELLIGENCE
        # =====================================================
        - name: dim_product
          description: "UC6 dimension table: Product catalog storing Product_ID, Product_Name, Brand, and Therapeutic_Area."
          columns:
            - name: Product_ID
              type: primary_key
            - name: Product_Name
              type: string
            - name: Brand
              type: string
            - name: Therapeutic_Area
              type: string

        - name: dim_time
          description: "UC6 dimension table: Time dimension storing Month_Key, Year, Month, Month_Start_Date, and Quarter."
          columns:
            - name: Month_Key
              type: primary_key
            - name: Year
              type: integer
            - name: Month
              type: string
            - name: Month_Start_Date
              type: date
            - name: Quarter
              type: string

        - name: fact_hcp_cohort
          description: "UC6 fact table: Main HCP cohort grouping table linking HCPs, products, time keys, and created dates."
          columns:
            - name: Cohort_ID
              type: primary_key
            - name: Created_Date
              type: date
            - name: id
              type: integer
              references: hcp_master.id
            - name: Product_ID
              type: string
              references: dim_product.Product_ID
            - name: Month_Key
              type: integer
              references: dim_time.Month_Key

        - name: fact_market_performance
          description: "UC6 fact table: Market performance metrics including TRx, NRx, and Market_Share linked to Cohort_ID."
          columns:
            - name: Market_ID
              type: primary_key
            - name: TRx
              type: string
            - name: NRx
              type: string
            - name: Market_Share
              type: string
            - name: Performance_Date
              type: date
            - name: Cohort_ID
              type: string
              references: fact_hcp_cohort.Cohort_ID

        - name: fact_rep_activity
          description: "UC6 fact table: Sales representative interactions including Call_Count, Visit_Count, Sample_Count, CLM_Count, and Speaker_Program_Count per Cohort_ID."
          columns:
            - name: Activity_ID
              type: primary_key
            - name: Call_Count
              type: integer
            - name: Visit_Count
              type: integer
            - name: Sample_Count
              type: integer
            - name: Event_Date
              type: date
            - name: Cohort_ID
              type: string
              references: fact_hcp_cohort.Cohort_ID
            - name: CLM_Count
              type: integer
            - name: Speaker_Program_Count
              type: integer

        - name: fact_patient_journey
          description: "UC6 fact table: Longitudinal patient journey metrics including Diagnosis_Date, Therapy_Start_Date, Persistence_Days, Adherence_Score per Cohort_ID."
          columns:
            - name: Journey_ID
              type: primary_key
            - name: Diagnosis_Date
              type: date
            - name: Therapy_Start_Date
              type: date
            - name: Persistence_Days
              type: integer
            - name: Cohort_ID
              type: string
              references: fact_hcp_cohort.Cohort_ID
            - name: Patient_ID
              type: string
            - name: Therapy_Stop_Date
              type: date
            - name: Adherence_Score
              type: integer

        - name: fact_digital_engagement
          description: "UC6 fact table: Digital channel engagement metrics including Email_Sent, Email_Open, Click_Count, Webinar_Attended per Cohort_ID."
          columns:
            - name: Engagement_ID
              type: primary_key
            - name: Email_Sent
              type: string
            - name: Email_Open
              type: string
            - name: Click_Count
              type: integer
            - name: Webinar_Attended
              type: integer
            - name: Engagement_Date
              type: date
            - name: Cohort_ID
              type: string
              references: fact_hcp_cohort.Cohort_ID

        - name: fact_ai_risk
          description: "UC6 fact table: AI risk scoring table including Risk_Score, Leakage_Risk_Score, Fatigue_Score, Risk_Level per Cohort_ID."
          columns:
            - name: Risk_ID
              type: primary_key
            - name: Risk_Score
              type: string
            - name: Leakage_Risk_Score
              type: string
            - name: Fatigue_Score
              type: string
            - name: Risk_Level
              type: string
            - name: Risk_Date
              type: date
            - name: Cohort_ID
              type: string
              references: fact_hcp_cohort.Cohort_ID

        - name: fact_milestone
          description: "UC6 fact table: Triggers and milestone tracking including Trigger_Type, Trigger_Date, Milestone_Status linked to Risk_ID."
          columns:
            - name: Milestone_ID
              type: primary_key
            - name: Trigger_Type
              type: string
            - name: Trigger_Date
              type: date
            - name: Milestone_Status
              type: string
            - name: Risk_ID
              type: string
              references: fact_ai_risk.Risk_ID

        - name: fact_nba
          description: "UC6 fact table: Next Best Action (NBA) recommendations including Recommendation, Priority, Confidence_Score, Suggested_Date, Cohort_Status linked to Milestone_ID."
          columns:
            - name: NBA_ID
              type: primary_key
            - name: Recommendation
              type: string
            - name: Priority
              type: string
            - name: Confidence_Score
              type: string
            - name: Suggested_Date
              type: date
            - name: Milestone_ID
              type: string
              references: fact_milestone.Milestone_ID
            - name: Cohort_Status
              type: string

  # ============================================================
  # VERIFIED JOIN PATHS (Only joins confirmed to return data)
  # ============================================================
  joins:
    - name: copay_to_hcp
      left_table: copay_Claims_Transactions
      right_table: hcp_master
      join_condition: "copay_Claims_Transactions.Prescriber_NPI = hcp_master.Prescriber_NPI"
      description: "Verified: 713 matching rows. Resolves full HCP profile from copay claims."

    - name: copay_to_payer
      left_table: copay_Claims_Transactions
      right_table: Payer_Master
      join_condition: "copay_Claims_Transactions.payer_id = Payer_Master.payer_id"
      description: "Verified: 713 matching rows. Resolves payer name, type, and region."

    - name: copay_to_reject_code
      left_table: copay_Claims_Transactions
      right_table: Reject_Code_Master
      join_condition: "copay_Claims_Transactions.reject_code = Reject_Code_Master.reject_code"
      description: "Verified: 178 matching rows. Resolves reject description and severity."

    - name: engagement_to_campaign
      left_table: hcp_engagement_logs
      right_table: campaign_master
      join_condition: "hcp_engagement_logs.Campaign_ID = campaign_master.campaign_id"
      description: "Verified: 42 matching rows. Resolves campaign name, type, channel."

    - name: engagement_to_hcp
      left_table: hcp_engagement_logs
      right_table: hcp_master
      join_condition: "hcp_engagement_logs.HCP_ID = hcp_master.Prescriber_NPI"
      description: "Verified: 42 matching rows. Resolves physician name and specialty."

    - name: compliance_to_payer
      left_table: Compliance_Table
      right_table: Payer_Master
      join_condition: "Compliance_Table.Payer_id = Payer_Master.payer_id"
      description: "Verified: 111 matching rows. Resolves payer name and type."

    - name: leakage_to_product
      left_table: Leakage_Activity
      right_table: Product_Master
      join_condition: "Leakage_Activity.productid = Product_Master.product_id"
      description: "Enriches leakage records with full product catalog details."

    # --- UC6 Join Paths ---
    - name: cohort_to_hcp
      left_table: fact_hcp_cohort
      right_table: hcp_master
      join_condition: "fact_hcp_cohort.id = hcp_master.id"
      description: "Resolves HCP master details for HCP cohorts."

    - name: cohort_to_product
      left_table: fact_hcp_cohort
      right_table: dim_product
      join_condition: "fact_hcp_cohort.Product_ID = dim_product.Product_ID"
      description: "Resolves product name, brand, and therapeutic area for cohorts."

    - name: cohort_to_time
      left_table: fact_hcp_cohort
      right_table: dim_time
      join_condition: "fact_hcp_cohort.Month_Key = dim_time.Month_Key"
      description: "Resolves month, year, and quarter for cohorts."

    - name: market_to_cohort
      left_table: fact_market_performance
      right_table: fact_hcp_cohort
      join_condition: "fact_market_performance.Cohort_ID = fact_hcp_cohort.Cohort_ID"
      description: "Links market performance (TRx, NRx, share) to HCP cohort."

    - name: activity_to_cohort
      left_table: fact_rep_activity
      right_table: fact_hcp_cohort
      join_condition: "fact_rep_activity.Cohort_ID = fact_hcp_cohort.Cohort_ID"
      description: "Links sales representative activities to HCP cohort."

    - name: journey_to_cohort
      left_table: fact_patient_journey
      right_table: fact_hcp_cohort
      join_condition: "fact_patient_journey.Cohort_ID = fact_hcp_cohort.Cohort_ID"
      description: "Links patient journey and adherence metrics to HCP cohort."

    - name: digital_to_cohort
      left_table: fact_digital_engagement
      right_table: fact_hcp_cohort
      join_condition: "fact_digital_engagement.Cohort_ID = fact_hcp_cohort.Cohort_ID"
      description: "Links digital engagement logs (emails, webinars, clicks) to HCP cohort."

    - name: risk_to_cohort
      left_table: fact_ai_risk
      right_table: fact_hcp_cohort
      join_condition: "fact_ai_risk.Cohort_ID = fact_hcp_cohort.Cohort_ID"
      description: "Links AI risk score, leakage risk score, and fatigue score to HCP cohort."

    - name: milestone_to_risk
      left_table: fact_milestone
      right_table: fact_ai_risk
      join_condition: "fact_milestone.Risk_ID = fact_ai_risk.Risk_ID"
      description: "Links milestone triggers and status to AI risk assessment."

    - name: nba_to_milestone
      left_table: fact_nba
      right_table: fact_milestone
      join_condition: "fact_nba.Milestone_ID = fact_milestone.Milestone_ID"
      description: "Links Next Best Action (NBA) recommendations and priorities to milestones."

  # ============================================================
  # BUSINESS TO DATABASE MAPPING RULES (STRICT)
  # ============================================================
  mapping_rules:
    - category: "Leakage & Claims Rejections (Primary)"
      rule: >
        ALL claims, rejection claims, claim rejections, pharmacy rejections, brand rejections, total rejections,
        leakage %, top leakage, and prescription drop-off queries MUST use `Leakage_Activity`.
        DO NOT use `copay_Claims_Transactions` for claim or rejection prompts.
        This table has PRE-RESOLVED columns: HCP_Name, BrandName, State, Pharmacy_ID, zip_code, Prescriber_NPI,
        Pharmacy_Rejections, Total_Brand_Rejections, Leakage_Percentage.
        Use `Pharmacy_Rejections` or `Total_Brand_Rejections` for rejection claims data.

    - category: "Fatigue Scores & Dynamic Fatigue Percentages"
      rule: >
        ALL fatigue queries MUST use `fatigue_score` DIRECTLY (HCP_Name, Product, Campaign_Name, Fatigue).
        DO NOT hardcode static numbers like 60 or 54.
        Dynamically calculate percentage against the maximum fatigue value in the database using a subquery:
        `CONCAT(ROUND((Fatigue / (SELECT MAX(Fatigue) FROM fatigue_score)) * 100, 1), '%') as fatigue_percentage`
        When user asks for percentage thresholds (e.g. 'more than 90% fatigue' or '> 90%'), filter dynamically:
        `WHERE (Fatigue / (SELECT MAX(Fatigue) FROM fatigue_score)) * 100 > 90`

    - category: "Claims & Rejections Mandate"
      rule: >
        DO NOT use `copay_Claims_Transactions` for any claim-related or rejection-related queries.
        Always route claims and rejection keywords to `Leakage_Activity` which stores `Pharmacy_Rejections`
        and `Total_Brand_Rejections`.

    - category: "Leakage Threshold History"
      rule: >
        ONLY for leakage limit, leakage threshold, history of changes, audit history, who updated.
        Use `leakage_history` table. Latest limit: SELECT new_value FROM leakage_history ORDER BY updated_at DESC LIMIT 1.
        Does NOT contain leakage percentage data.

    - category: "Compliance & Government Plans"
      rule: >
        Queries about government plans, Medicaid, Medicare, bypassed records, or compliance violations
        MUST use `Compliance_Table`. JOIN with `Payer_Master` ON Payer_id = payer_id for payer details.

    - category: "HCP Specialty & Contact Info"
      rule: >
        For physician specialty, email, phone, fax, or license info, query `hcp_master`.
        Full name = CONCAT(hcp_firstName, ' ', hcp_lastName). Specialties: 18 types including
        Cardiology, Oncology, Neurology, etc. Practice states: TX, TN, KA.

    - category: "Email & Engagement Metrics"
      rule: >
        For email open rates, webinar minutes, engagement channels, use `hcp_engagement_logs`.
        JOIN `campaign_master` ON Campaign_ID for campaign details.
        JOIN `hcp_master` ON HCP_ID = Prescriber_NPI for physician names.
        Channels available: Email, Webinar.

    - category: "Campaign Details"
      rule: >
        For campaign budget, target audience, channel, status, use `campaign_master` directly.
        Statuses: Active, Completed, Planned, Cancelled. 8 channels, 10 types.

    - category: "Column Name Safety"
      rule: >
        NEVER invent column names. Key rules:
        1) `Product_Master.brand_name` is lowercase; `Leakage_Activity.BrandName` is camelCase.
        2) NEVER join Prescriber_NPI to HCP_Name (ID vs string — will never match).
        3) Payer_Type does NOT exist on Leakage_Activity (use Compliance_Table or Payer_Master).
        4) Rejection_Root_Cause does NOT exist on any table (use reject_code/Reject_Message).
        5) 'leakage' column does NOT exist (use Leakage_Percentage).

    - category: "Today's & Specific Date Queries"
      rule: >
        When the user explicitly asks for 'today\'s' records or data for today (e.g., 'Show today\'s leakage alerts' or 'today\'s transactions'),
        you MUST strictly filter using `CURDATE()` or `CURRENT_DATE()` on the relevant date column:
        For `Leakage_Activity`: `WHERE DATE(Processed_TimeStamp) = CURDATE()`
        For `copay_Claims_Transactions`: `WHERE DATE(transaction_datetime) = CURDATE()`
        For `Compliance_Table`: `WHERE DATE(Created_At) = CURDATE()`

  # ============================================================
  # PRE-DEFINED SQL MEASURES (Verified to return data)
  # ============================================================
  measures:
    # --- UC1: Leakage Signals ---
    - name: top_leakage_by_hcp
      description: "Top HCPs by leakage percentage"
      sql: "SELECT HCP_Name, BrandName, State, Pharmacy_Rejections, Leakage_Percentage FROM Leakage_Activity ORDER BY Leakage_Percentage DESC"

    - name: todays_leakage_alerts
      description: "Gets leakage alerts for today's date using CURDATE()"
      sql: "SELECT HCP_Name, BrandName, Pharmacy_ID, zip_code, Prescriber_NPI, State, Pharmacy_Rejections, Total_Brand_Rejections, Leakage_Percentage, Processed_TimeStamp FROM Leakage_Activity WHERE DATE(Processed_TimeStamp) = CURDATE() ORDER BY Leakage_Percentage DESC"

    - name: leakage_by_state
      description: "Leakage summary grouped by state"
      sql: "SELECT State, COUNT(*) as record_count, SUM(Pharmacy_Rejections) as total_rejections, AVG(Leakage_Percentage) as avg_leakage_pct FROM Leakage_Activity GROUP BY State ORDER BY total_rejections DESC"

    - name: latest_leakage_limit
      description: "Gets the latest leakage threshold value"
      sql: "SELECT new_value FROM leakage_history ORDER BY updated_at DESC LIMIT 1"

    - name: leakage_threshold_history
      description: "Full audit trail of leakage threshold changes"
      sql: "SELECT previous_value, new_value, updated_by, updated_at FROM leakage_history ORDER BY updated_at DESC"

    # --- UC1: Copay Claims Analysis ---
    - name: rejected_claims_by_specialty
      description: "Rejected copay claims grouped by physician specialty"
      sql: "SELECT HCP_Specialty, COUNT(*) as rejected_count, SUM(claim_amount) as total_amount FROM copay_Claims_Transactions WHERE claim_status = 'REJECTED' GROUP BY HCP_Specialty ORDER BY rejected_count DESC"

    - name: claims_by_payer_type
      description: "Copay claims breakdown by payer type"
      sql: "SELECT pm.payer_type, cct.claim_status, COUNT(*) as claim_count, SUM(cct.claim_amount) as total_amount FROM copay_Claims_Transactions cct JOIN Payer_Master pm ON cct.payer_id = pm.payer_id GROUP BY pm.payer_type, cct.claim_status ORDER BY claim_count DESC"

    - name: rejected_claims_with_severity
      description: "Rejected claims with reject code descriptions and severity"
      sql: "SELECT cct.reject_code, rcm.reject_description, rcm.severity, COUNT(*) as count, SUM(cct.claim_amount) as total_amount FROM copay_Claims_Transactions cct JOIN Reject_Code_Master rcm ON cct.reject_code = rcm.reject_code WHERE cct.claim_status = 'REJECTED' GROUP BY cct.reject_code, rcm.reject_description, rcm.severity ORDER BY count DESC"

    - name: top_claims_by_amount
      description: "Top copay claims by dollar amount with physician details"
      sql: "SELECT cct.Transaction_ID, cct.BrandName, cct.claim_amount, cct.claim_status, cct.HCP_First_Name, cct.HCP_Last_Name, cct.HCP_Specialty, cct.HCP_Practice_State FROM copay_Claims_Transactions cct ORDER BY cct.claim_amount DESC"

    # --- UC2: Journey Orchestration ---
    - name: hcp_fatigue_summary
      description: "All HCP fatigue scores"
      sql: "SELECT HCP_Name, Product, Campaign_Name, Fatigue FROM fatigue_score ORDER BY Fatigue DESC"

    - name: hcp_fatigue_percentage
      description: "HCP fatigue score converted to percentage (>90% threshold) using dynamic MAX subquery"
      sql: "SELECT HCP_Name, Fatigue as raw_score, CONCAT(ROUND((Fatigue / (SELECT MAX(Fatigue) FROM fatigue_score)) * 100, 1), '%') as fatigue_percentage, Product, Campaign_Name FROM fatigue_score WHERE (Fatigue / (SELECT MAX(Fatigue) FROM fatigue_score)) * 100 > 90 ORDER BY Fatigue DESC"

    - name: email_open_rate_by_campaign
      description: "Email open rate per campaign"
      sql: "SELECT cm.campaign_name, SUM(hel.Email_Sent) as total_sent, SUM(hel.Email_Opened) as total_opened, ROUND(SUM(hel.Email_Opened) / NULLIF(SUM(hel.Email_Sent), 0) * 100, 2) as open_rate_pct FROM hcp_engagement_logs hel JOIN campaign_master cm ON hel.Campaign_ID = cm.campaign_id GROUP BY cm.campaign_name ORDER BY open_rate_pct DESC"

    - name: hcp_specialty_distribution
      description: "Physician count by specialty"
      sql: "SELECT specialty, COUNT(*) as hcp_count FROM hcp_master GROUP BY specialty ORDER BY hcp_count DESC"

    - name: compliance_by_payer
      description: "Compliance violations by payer name and type"
      sql: "SELECT pm.payer_name, pm.payer_type, pm.region, COUNT(*) as violation_count FROM Compliance_Table ct JOIN Payer_Master pm ON ct.Payer_id = pm.payer_id GROUP BY pm.payer_name, pm.payer_type, pm.region ORDER BY violation_count DESC"

    - name: campaign_budget_by_channel
      description: "Campaign budget allocation by channel"
      sql: "SELECT channel, COUNT(*) as campaign_count, SUM(budget_amount) as total_budget, AVG(budget_amount) as avg_budget FROM campaign_master GROUP BY channel ORDER BY total_budget DESC"

    # --- UC4: Clinical Medicine Extraction ---
    - name: extracted_medicines_summary
      description: "All extracted medicine logs with HCP names, drug brand/generic, dosage, and frequency"
      sql: "SELECT HCP_Name, extracted_drug, brand_name, generic_name, dosage, frequency, confidence_score, extracted_at FROM medicine_extraction_log ORDER BY extracted_at DESC"

    - name: tablet_extraction_history_list
      description: "Tablet extraction history including tablet names, dosages, frequencies, and clinical guidance"
      sql: "SELECT Tablet_name, Dosage, Frequency, guidance, Prescriber_NPI, sf_id, status, message, timestamp FROM Tablet_Extract_History ORDER BY timestamp DESC"

    - name: transcript_extraction_history_list
      description: "Voice transcript extraction history and extracted tablet names"
      sql: "SELECT hcp_detail_id, Prescriber_NPI, sf_id, transcript_text, tablet_names, status, created_at FROM Transcript_Extraction_History ORDER BY created_at DESC"

    # --- UC5: Salesforce Integration & Sync Audit ---
    - name: salesforce_sync_audit_log
      description: "Salesforce CRM sync audit status log for all HCP records"
      sql: "SELECT sync_id, Prescriber_NPI, HCP_Name, sf_object_type, sf_record_id, sync_status, sync_message, synced_at FROM salesforce_sync_log ORDER BY synced_at DESC"

    - name: pending_salesforce_sync_records
      description: "HCP records pending or failed in Salesforce CRM sync"
      sql: "SELECT sync_id, Prescriber_NPI, HCP_Name, sf_object_type, sync_status, sync_message FROM salesforce_sync_log WHERE sync_status != 'Synced'"

    # --- UC6: Next Best Action (NBA) & Cohort Intelligence ---
    - name: nba_recommendations_summary
      description: "Top Next Best Action recommendations with priority, confidence score, trigger type, and risk level"
      sql: "SELECT fna.NBA_ID, fna.Recommendation, fna.Priority, fna.Confidence_Score, fna.Suggested_Date, fna.Cohort_Status, fm.Trigger_Type, far.Risk_Level FROM fact_nba fna JOIN fact_milestone fm ON fna.Milestone_ID = fm.Milestone_ID JOIN fact_ai_risk far ON fm.Risk_ID = far.Risk_ID ORDER BY fna.Suggested_Date DESC"

    - name: hcp_cohort_risk_overview
      description: "HCP cohort risk overview including product brand, month/year, risk score, leakage risk, and fatigue score"
      sql: "SELECT fhc.Cohort_ID, fhc.Created_Date, dp.Product_Name, dp.Brand, dt.Month, dt.Year, far.Risk_Score, far.Leakage_Risk_Score, far.Fatigue_Score, far.Risk_Level FROM fact_hcp_cohort fhc JOIN dim_product dp ON fhc.Product_ID = dp.Product_ID JOIN dim_time dt ON fhc.Month_Key = dt.Month_Key JOIN fact_ai_risk far ON fhc.Cohort_ID = far.Cohort_ID ORDER BY far.Risk_Score DESC"

    - name: rep_activity_by_cohort
      description: "Aggregated sales representative activities by cohort"
      sql: "SELECT Cohort_ID, SUM(Call_Count) as total_calls, SUM(Visit_Count) as total_visits, SUM(Sample_Count) as total_samples, SUM(CLM_Count) as total_clm, SUM(Speaker_Program_Count) as total_speaker_programs FROM fact_rep_activity GROUP BY Cohort_ID"

    - name: digital_engagement_by_cohort
      description: "Digital engagement activity metrics summarized by cohort"
      sql: "SELECT Cohort_ID, SUM(CAST(Email_Sent AS UNSIGNED)) as total_email_sent, SUM(CAST(Email_Open AS UNSIGNED)) as total_email_open, SUM(Click_Count) as total_clicks, SUM(Webinar_Attended) as total_webinars FROM fact_digital_engagement GROUP BY Cohort_ID"

    - name: hcp_cohort_overview
      description: "Gets the full list of cohorts with HCP names and products."
      sql: "SELECT c.Cohort_ID, CONCAT(h.hcp_firstName, ' ', h.hcp_lastName) as HCP_Name, p.Product_Name, c.Cohort_ID as Cohort_Type FROM fact_hcp_cohort c JOIN hcp_master h ON c.id = h.id JOIN dim_product p ON c.Product_ID = p.Product_ID"

    - name: cohort_ai_risks
      description: "Gets AI risk levels and fatigue scores per cohort."
      sql: "SELECT Cohort_ID, Risk_Score, Fatigue_Score, Risk_Level, Risk_Date FROM fact_ai_risk ORDER BY Risk_Date DESC"

    - name: cohort_nba_recommendations
      description: "Gets next best actions and AI recommendations for cohorts."
      sql: "SELECT n.NBA_ID, m.Trigger_Type as Issue, n.Recommendation, n.Priority, n.Confidence_Score FROM fact_nba n JOIN fact_milestone m ON n.Milestone_ID = m.Milestone_ID"

    - name: cohort_market_decline_nba
      description: "Gets cohorts created in 2026 with low Market Share or NRx, showing quarter, fatigue score, and NBA recommendation."
      sql: "SELECT c.Cohort_ID, t.Month, t.Quarter, r.Fatigue_Score, n.Recommendation, n.Suggested_Date FROM fact_hcp_cohort c JOIN dim_time t ON c.Month_Key = t.Month_Key JOIN fact_market_performance mp ON c.Cohort_ID = mp.Cohort_ID JOIN fact_ai_risk r ON c.Cohort_ID = r.Cohort_ID JOIN fact_milestone m ON r.Risk_ID = m.Risk_ID JOIN fact_nba n ON m.Milestone_ID = n.Milestone_ID WHERE t.Year = 2026 AND (CAST(REPLACE(mp.Market_Share, '%', '') AS DECIMAL(10,2)) < 30 OR CAST(mp.NRx AS UNSIGNED) < 50)"
