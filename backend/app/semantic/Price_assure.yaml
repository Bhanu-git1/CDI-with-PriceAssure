        # =====================================================
        # TABLE 13: gp_comparison_results
        # =====================================================
        - name: gp_comparison_results
          description: >
            Reconciliation comparison results between calculated GP values (gp_nm_direct_sale_gp_calc)
            and baseline source values (gp_nm_direct_sale_gp_calc_src).
            Tracks unit differences, amount differences, and match/variance statuses.
          columns:
            - name: item_id
              type: integer
              description: "Line item identifier being compared"
            - name: ndc11
              type: string
              description: "11-digit National Drug Code"
            - name: product_name
              type: string
              description: "Pharmaceutical product name"
            - name: component
              type: string
              description: "Calculation component being evaluated"
            - name: gp_nm_direct_sale_gp_calc_total_unit
              type: integer
              description: "Calculated total units from gp_nm_direct_sale_gp_calc"
            - name: gp_nm_direct_sale_gp_calc_total_amount
              type: decimal
              description: "Calculated total amount from gp_nm_direct_sale_gp_calc"
            - name: gp_nm_direct_sale_gp_calc_src_total_unit
              type: integer
              description: "Baseline source total units from gp_nm_direct_sale_gp_calc_src"
            - name: gp_nm_direct_sale_gp_calc_src_total_amount
              type: decimal
              description: "Baseline source total amount from gp_nm_direct_sale_gp_calc_src"
            - name: unit_difference
              type: integer
              description: "Variance in units (Calculated Units - Source Units)"
            - name: amount_difference
              type: decimal
              description: "Variance in currency amount (Calculated Amount - Source Amount)"
            - name: status
              type: string
              description: "Comparison status indicator (e.g. 'MATCH', 'DIFF', 'ERROR')"
            - name: invoice_year
              type: string
              description: "Reporting year"
            - name: invoice_month
              type: string
              description: "Reporting month"
            - name: invoice_quarterly
              type: string
              description: "Reporting quarter"

        # =====================================================
        # TABLE 14: gp_logs
        # =====================================================
        - name: gp_logs
          description: >
            Audit execution log for PriceAssure file uploads and government pricing data processing runs.
            Records file names, uploading users, upload timestamps, price types, and pipeline statuses.
          columns:
            - name: id
              type: primary_key
              description: "Unique log entry identifier (AUTO_INCREMENT)"
            - name: file_name
              type: string
              description: "Name of the uploaded input data file"
            - name: uploaded_by
              type: string
              description: "User account or service identity that performed the upload"
            - name: uploaded_date
              type: datetime
              description: "Timestamp when the file was uploaded"
            - name: price_type
              type: string
              description: "Government pricing price type classification"
            - name: status
              type: string
              description: "Processing pipeline execution status (e.g. 'Success', 'Failed', 'In-Progress')"
