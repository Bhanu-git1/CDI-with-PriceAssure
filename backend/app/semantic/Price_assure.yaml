        - name: gp_nm_direct_sale_gp_calc
          description: >
            Government Pricing (GP) Non-Medicaid calculation results table.
            Captures calculated total units, total amounts, Average Manufacturer Price (AMP),
            and period dimensions (year, month, quarter) by product and NDC11.
          columns:
            - name: id
              type: primary_key
              description: "Unique calculation record identifier (AUTO_INCREMENT)"
