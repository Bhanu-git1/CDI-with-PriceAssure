              type: integer
              description: "Line item reference identifier"
            - name: ndc11
              type: string
              description: "11-digit National Drug Code identifier"
            - name: product_name
              type: string
              description: "Pharmaceutical product brand name"
            - name: component
              type: string
              description: "Government pricing calculation component name"
            - name: total_unit
              type: decimal
              description: "Total calculated units for the period"
            - name: total_amount
              type: decimal
              description: "Total calculated sales amount for the period"
            - name: amp
              type: decimal
              description: "Average Manufacturer Price (AMP) calculated per unit"
            - name: invoice_year
              type: string
              description: "Invoice reporting year (e.g. '2024')"
            - name: invoice_month
              type: string
              description: "Invoice reporting month (e.g. '01', 'January')"
            - name: invoice_quarterly
              type: string
              description: "Invoice reporting quarter (e.g. 'Q1', '2024Q1')"

