  # ============================================================
  # JOIN PATHS
  # 7 are declared foreign keys; the BATCH_NUM and master-lookup
  # paths are the documented pipeline flow.
  # ============================================================
  joins:
    - name: rbac_role_to_permission
      left_table: GPO_ROLE_PERMISSION
      right_table: GPO_ROLE_MASTER
      join_condition: "GPO_ROLE_PERMISSION.ROLE_ID = GPO_ROLE_MASTER.ROLE_ID"
      description: "Declared FK. CRUD permissions (CAN_VIEW/CAN_ADD/CAN_EDIT/CAN_DELETE) for a role."
    - name: rbac_role_to_mapping
      left_table: GPO_ROLE_MAPPING
      right_table: GPO_ROLE_MASTER
      join_condition: "GPO_ROLE_MAPPING.ROLE_ID = GPO_ROLE_MASTER.ROLE_ID"
      description: "Declared FK. Which users are assigned a role."
    - name: rbac_mapping_to_login
      left_table: GPO_USER_LOGIN
      right_table: GPO_ROLE_MAPPING
      join_condition: "GPO_USER_LOGIN.USER_ID = GPO_ROLE_MAPPING.USER_ID"
      description: "Declared FK. Login/token sessions for a mapped user."
    - name: member_to_org_id
      left_table: MN_ORGANIZATION_ID
      right_table: MN_MEMBER
      join_condition: "MN_ORGANIZATION_ID.MEMBER_ID = MN_MEMBER.MEMBER_ID"
      description: "Declared FK. One member has many organization identifiers."
    - name: member_to_eligible_customer
      left_table: MN_CF_ELIGIBLE_CUSTOMER
      right_table: MN_MEMBER
      join_condition: "MN_CF_ELIGIBLE_CUSTOMER.MEMBER_ID = MN_MEMBER.MEMBER_ID"
      description: "Declared FK. One member has many eligible-customer records."
    - name: doc_to_contract
      left_table: MN_STRUCTURED_CONTRACT
      right_table: MN_STRUCTURED_DOC
      join_condition: "MN_STRUCTURED_CONTRACT.STRUCT_DOC_ID = MN_STRUCTURED_DOC.STRUCT_DOC_ID"
      description: "Declared FK. One structured document has many structured contracts."
    - name: hdr_to_input
      left_table: GPO_CUST_INPUT
      right_table: GPO_CUST_HDR
      join_condition: "GPO_CUST_INPUT.BATCH_NUM = GPO_CUST_HDR.BATCH_NUM"
      description: "Declared FK. Standardized input rows for a batch."
    - name: hdr_to_staged
      left_table: GPO_STAGED_INPUT
      right_table: GPO_CUST_HDR
      join_condition: "GPO_STAGED_INPUT.BATCH_NUM = GPO_CUST_HDR.BATCH_NUM"
      description: "Raw uploaded rows for a batch."
    - name: hdr_to_jobs
      left_table: GPO_VALIDATION_JOBS
      right_table: GPO_CUST_HDR
      join_condition: "GPO_VALIDATION_JOBS.BATCH_NUM = GPO_CUST_HDR.BATCH_NUM"
      description: "Per-stage job status for a batch."
    - name: hdr_to_logs
      left_table: GPO_LOGS
      right_table: GPO_CUST_HDR
      join_condition: "GPO_LOGS.BATCH_NUM = GPO_CUST_HDR.BATCH_NUM"
      description: "Audit rows for a batch."
    - name: hdr_to_stg_output
      left_table: GPO_CUST_STG_OUTPUT
      right_table: GPO_CUST_HDR
      join_condition: "GPO_CUST_STG_OUTPUT.BATCH_NUM = GPO_CUST_HDR.BATCH_NUM"
      description: "Staged (pre-final) merged output for a batch."
    - name: hdr_to_output
      left_table: GPO_CUST_OUTPUT
      right_table: GPO_CUST_HDR
      join_condition: "GPO_CUST_OUTPUT.BATCH_NUM = GPO_CUST_HDR.BATCH_NUM"
      description: "Final formatted output for a batch."
    - name: hdr_to_mail_monitor
      left_table: MAIL_MONITOR
      right_table: GPO_CUST_HDR
      join_condition: "MAIL_MONITOR.BATCH_NUM = GPO_CUST_HDR.BATCH_NUM"
      description: "Batches that arrived via the mail channel."
    - name: input_to_hin_validate
      left_table: GPO_HIN_VALIDATE
      right_table: GPO_CUST_INPUT
      join_condition: "GPO_HIN_VALIDATE.BATCH_NUM = GPO_CUST_INPUT.BATCH_NUM AND GPO_HIN_VALIDATE.ORIGINAL_HIN = GPO_CUST_INPUT.HIN"
      description: "HIN validation outcome for an input row."
    - name: input_to_dea_validate
      left_table: GPO_DEA_VALIDATE
      right_table: GPO_CUST_INPUT
      join_condition: "GPO_DEA_VALIDATE.BATCH_NUM = GPO_CUST_INPUT.BATCH_NUM AND GPO_DEA_VALIDATE.ORIGINAL_DEA = GPO_CUST_INPUT.DEA"
      description: "DEA validation outcome for an input row."
    - name: input_to_hrsa_validate
      left_table: GPO_HRSA_VALIDATE
      right_table: GPO_CUST_INPUT
      join_condition: "GPO_HRSA_VALIDATE.BATCH_NUM = GPO_CUST_INPUT.BATCH_NUM AND GPO_HRSA_VALIDATE.ORIGINAL_HRSA = GPO_CUST_INPUT.HRSA"
      description: "HRSA validation outcome for an input row."
    - name: input_to_usps_validate
      left_table: GPO_USPS_VALIDATE
      right_table: GPO_CUST_INPUT
      join_condition: "GPO_USPS_VALIDATE.BATCH_NUM = GPO_CUST_INPUT.BATCH_NUM AND GPO_USPS_VALIDATE.ORIGINAL_NAME = GPO_CUST_INPUT.NAME"
      description: "USPS address validation outcome for an input row."
    - name: input_to_cot_validate
      left_table: GPO_COT_VALIDATE
      right_table: GPO_CUST_INPUT
      join_condition: "GPO_COT_VALIDATE.BATCH_NUM = GPO_CUST_INPUT.BATCH_NUM AND GPO_COT_VALIDATE.CUSTOMER_NAME = GPO_CUST_INPUT.NAME"
      description: "Class-of-Trade outcome for an input row."
    - name: input_to_member_validate
      left_table: GPO_MEMBER_VALIDATE
      right_table: GPO_CUST_INPUT
      join_condition: "GPO_MEMBER_VALIDATE.BATCH_NUM = GPO_CUST_INPUT.BATCH_NUM AND GPO_MEMBER_VALIDATE.NAME = GPO_CUST_INPUT.NAME"
      description: "Membership matching outcome for an input row."
    - name: hin_validate_to_master
      left_table: GPO_HIN_VALIDATE
      right_table: GPO_HIN
      join_condition: "GPO_HIN_VALIDATE.UPDATED_HIN = GPO_HIN.HIN"
      description: "Resolves the matched HIN master record (authoritative name/COT/address)."
    - name: dea_validate_to_master
      left_table: GPO_DEA_VALIDATE
      right_table: GPO_DEA
      join_condition: "GPO_DEA_VALIDATE.UPDATED_DEA = GPO_DEA.DEA"
      description: "Resolves the matched DEA master record."
    - name: hrsa_validate_to_master
      left_table: GPO_HRSA_VALIDATE
      right_table: GPO_HRSA
      join_condition: "GPO_HRSA_VALIDATE.UPDATED_HRSA = GPO_HRSA.HRSA"
      description: "Resolves the matched HRSA master record."
    - name: stg_output_to_output
      left_table: GPO_CUST_OUTPUT
      right_table: GPO_CUST_STG_OUTPUT
      join_condition: "GPO_CUST_OUTPUT.BATCH_NUM = GPO_CUST_STG_OUTPUT.BATCH_NUM AND GPO_CUST_OUTPUT.KEYNUM = GPO_CUST_STG_OUTPUT.KEYNUM"
      description: "Final output row and the staged row it came from."
    - name: display_msg_to_ttbc
      left_table: TTBC
      right_table: DISPLAY_MSG
      join_condition: "TTBC.MSG_NUM = DISPLAY_MSG.MSG_NUM"
      description: "Message component code to display text."

  # ============================================================
  # BUSINESS TO DATABASE MAPPING RULES (STRICT)
  # ============================================================
  mapping_rules:
    - category: "Batch correlation key"
      rule: >
        BATCH_NUM is THE correlation key for this database. Every pipeline question is scoped to a
        batch, and GPO_CUST_HDR is the batch header hub. When the user names a batch, filter
        BATCH_NUM on every table in the query. GPO_CUST_INPUT (~438k rows), GPO_HIN_VALIDATE
        (~199k rows) and GPO_STAGED_INPUT (~483k rows) MUST always be filtered by BATCH_NUM or
        another selective predicate — never scan them whole.
    - category: "Job status vs match status - CRITICAL"
      rule: >
        Two different 'STATUS' concepts exist and must never be interchanged.
        1) PROCESSING / JOB status lives ONLY on GPO_VALIDATION_JOBS: STATUS ('In-Progress',
        'Completed', 'Failed', 'Cancelled', 'Started', 'Pending', 'Open') and the per-stage
        columns HIN_STATUS, DEA_STATUS, USPS_STATUS, COT_STATUS, HRSA_STATUS, MEMBER_STATUS,
        STG_STATUS, OUTPUT_STATUS. Stage values are stored with INCONSISTENT CASING
        ('pending', 'completed', 'failed', 'In-Progress'), so ALWAYS compare case-insensitively:
        WHERE LOWER(HIN_STATUS) = 'failed'.
        2) MATCH OUTCOME status lives on the *_VALIDATE tables and is NOT a job state:
        GPO_HIN_VALIDATE.STATUS / GPO_DEA_VALIDATE.STATUS / GPO_HRSA_VALIDATE.STATUS use
        'DUP', 'SAME', 'NO', 'ONE'; GPO_MEMBER_VALIDATE.STATUS uses 'Same', 'One', 'New', 'No'.
        So 'which batches failed HIN validation' -> GPO_VALIDATION_JOBS.HIN_STATUS, NOT
        GPO_HIN_VALIDATE.STATUS.
    - category: "Completion flags vs stage status"
      rule: >
        GPO_CUST_HDR carries BOOLEAN completion flags: HIN_VALIDATED, DEA_VALIDATED,
        USPS_VALIDATED, COT_VALIDATED, HRSA_VALIDATED, MEMBER_VALIDATED, isOutputGenerated
        (0 = not done, 1 = done). Use these for 'has stage X been done for this batch'.
        Use GPO_VALIDATION_JOBS.*_STATUS for 'how did stage X end up'. CURRENT_ACTION on
        GPO_CUST_HDR names the stage the batch is sitting at
        ('UPLOAD', 'HIN', 'COT', 'HRSA', 'USPS', 'MEMBER', 'FINAL OUTPUT', 'CANCELLED')
        and is NULL for batches that have not progressed.
    - category: "Staged output vs final output"
      rule: >
        GPO_CUST_STG_OUTPUT is the PRE-FINAL merge (carries both SOURCE_* and CORRECTED_* values);
        GPO_CUST_OUTPUT is the FINAL customer-facing deliverable (CORRECTED_* only). Never mix them
        in one answer, and never present staged rows as final output. 'Was output generated?' is
        answered by GPO_CUST_HDR.isOutputGenerated.
    - category: "Original vs corrected values"
      rule: >
        Validation tables store the submitted value and the corrected value side by side:
        GPO_HIN_VALIDATE / GPO_DEA_VALIDATE / GPO_HRSA_VALIDATE / GPO_USPS_VALIDATE use
        ORIGINAL_* and UPDATED_*; GPO_COT_VALIDATE uses ORIGINAL_COT and CORRECTED_COT;
        GPO_CUST_STG_OUTPUT uses SOURCE_* and CORRECTED_*. When the user asks 'what changed',
        return both sides. A record was corrected when the two differ.
    - category: "Class of Trade is derived"
      rule: >
        COT is NOT a master lookup. GPO_COT_VALIDATE reconciles ORIGINAL_COT against HIBCC_COT
        (from the HIN match), DEA_COT (from the DEA match) and RODB_COT to produce CORRECTED_COT,
        keyed by BATCH_NUM + CUSTOMER_NAME. There is no GPO_COT master table — do not invent one.
    - category: "Program-specific pipelines - ASK, DO NOT ASSUME"
      rule: >
        Four parallel pipelines exist in this database with near-identical table shapes:
        GPO_* (the base/default program), REG_*, ABBOTT_* and EISAI_*.
        Use GPO_* tables unless the user explicitly names REG, Abbott or Eisai.
        If a question about batches, validation or output could apply to more than one program and
        the user has not said which, ASK which program they mean rather than guessing — the numbers
        differ completely between them.
        Note ABBOTT_* has no HIN/DEA/USPS validators (it uses ABBOTT_CYCLIC_VALIDATE and
        ABBOTT_PARENT_VALIDATE), and EISAI_* is change-tracking (additions/removals/changes),
        not validation.
    - category: "Membership vs member validation"
      rule: >
        These are unrelated despite similar names.
        - MN_MEMBER / MN_ORGANIZATION_ID / MN_CF_ELIGIBLE_CUSTOMER = reference membership master
        data, keyed by MEMBER_ID, NOT batch-scoped.
        - GPO_MEMBER_VALIDATE = per-batch membership MATCHING results, keyed by BATCH_NUM + NAME.
        - GPO_MEMBERSHIP_HEIRARCHY = GPO parent/child org hierarchy.
        Pick by whether the question is about reference data or about a batch run.
    - category: "Audit trail"
      rule: >
        GPO_LOGS is the only audit table for the GPO program (REG_LOGS and ABBOTT_LOGS for those
        programs). Query it by BATCH_NUM and USER_ACTION. Real USER_ACTION values include
        'HIN Validation', 'HIN Verification', 'HIN Selection', 'USPS Validation', 'DEA Validation',
        'COT Validation', 'Output File', 'STAGE_OUPTUT' (note the typo in the data) and
        'Upload Member File'.
    - category: "Column naming and safety"
      rule: >
        Business columns in this database are UPPER_CASE (BATCH_NUM, ORIGINAL_HIN, CURRENT_ACTION),
        with a few exceptions: GPO_CUST_HDR.isOutputGenerated, GPO_LOGS.action_desc and
        GPO_COT_VALIDATE.Modified. Table name spellings to respect exactly:
        GPO_MEMBERSHIP_HEIRARCHY and EISAI_MEMBERSHIP_HEIRARCHY_CHANGES ('HEIRARCHY'),
        GPO_ADMIN_VALIDATION_CONFIG.SIMILIARITY_TYPE ('SIMILIARITY').
        Output tables use KEYNUM while GPO_CUST_INPUT/GPO_HIN/GPO_DEA use KEY_NUM.
        NEVER invent a table or column name — call describe_table('<name>') when unsure.
    - category: "Read-only and result size"
      rule: >
        This source is strictly read-only: SELECT / SHOW / DESCRIBE / EXPLAIN only.
        Cross-table search is DISABLED here because of table sizes — use targeted SELECTs with a
        WHERE clause. Prefer aggregates (COUNT/GROUP BY) over returning raw rows from the large
        tables.

  # ============================================================
  # PRE-DEFINED SQL MEASURES
  # Templates using verified column names. Replace <batch_num>
  # with the batch the user asked about.
  # ============================================================
  measures:
    - name: batch_pipeline_status
      description: "Per-stage status for a batch, joined to its header"
      sql: "SELECT h.BATCH_NUM, h.FILE_NAME, h.CURRENT_ACTION, h.TOTAL_RECORDS, h.VALID_RECORDS, h.ERROR_RECORDS, j.STATUS, j.HIN_STATUS, j.DEA_STATUS, j.HRSA_STATUS, j.USPS_STATUS, j.COT_STATUS, j.MEMBER_STATUS, j.STG_STATUS, j.OUTPUT_STATUS, j.PROCESSING_TIME FROM GPO_CUST_HDR h JOIN GPO_VALIDATION_JOBS j ON h.BATCH_NUM = j.BATCH_NUM WHERE h.BATCH_NUM = <batch_num>"
    - name: recent_batches
      description: "Most recently created batches with their validation completion flags"
      sql: "SELECT BATCH_NUM, FILE_NAME, CREATED_DATE, CREATED_BY, CURRENT_ACTION, VALIDATION_TYPE, TOTAL_RECORDS, VALID_RECORDS, ERROR_RECORDS, HIN_VALIDATED, DEA_VALIDATED, HRSA_VALIDATED, USPS_VALIDATED, COT_VALIDATED, MEMBER_VALIDATED, isOutputGenerated FROM GPO_CUST_HDR ORDER BY CREATED_DATE DESC LIMIT 20"
    - name: failed_stages_by_batch
      description: "Batches with any stage in a failed state (case-insensitive)"
      sql: "SELECT BATCH_NUM, STATUS, HIN_STATUS, DEA_STATUS, HRSA_STATUS, USPS_STATUS, COT_STATUS, MEMBER_STATUS, STG_STATUS, OUTPUT_STATUS FROM GPO_VALIDATION_JOBS WHERE LOWER(STATUS) = 'failed' OR LOWER(HIN_STATUS) = 'failed' OR LOWER(DEA_STATUS) = 'failed' OR LOWER(HRSA_STATUS) = 'failed' OR LOWER(USPS_STATUS) = 'failed' OR LOWER(COT_STATUS) = 'failed' OR LOWER(MEMBER_STATUS) = 'failed' OR LOWER(OUTPUT_STATUS) = 'failed' ORDER BY BATCH_NUM DESC"
    - name: job_status_summary
      description: "Count of batches by overall job status"
      sql: "SELECT STATUS, COUNT(*) AS batch_count FROM GPO_VALIDATION_JOBS GROUP BY STATUS ORDER BY batch_count DESC"
    - name: hin_match_outcome_summary
      description: "HIN match outcomes for a batch, by match type"
      sql: "SELECT STATUS, MATCH_TYPE, COUNT(*) AS record_count FROM GPO_HIN_VALIDATE WHERE BATCH_NUM = <batch_num> GROUP BY STATUS, MATCH_TYPE ORDER BY record_count DESC"
    - name: hin_corrections_for_batch
      description: "HIN records whose value or name was changed by validation"
      sql: "SELECT BATCH_NUM, ORIGINAL_NAME, ORIGINAL_HIN, UPDATED_NAME, UPDATED_HIN, STATUS, MATCH_TYPE, SIMILARITY_SCORE FROM GPO_HIN_VALIDATE WHERE BATCH_NUM = <batch_num> AND (ORIGINAL_HIN <> UPDATED_HIN OR ORIGINAL_NAME <> UPDATED_NAME) LIMIT 200"
    - name: unmatched_hin_records
      description: "Input records that found no HIN match in a batch"
      sql: "SELECT BATCH_NUM, ORIGINAL_NAME, ORIGINAL_HIN, ORIGINAL_CITY, ORIGINAL_STATE, STATUS, MATCH_TYPE FROM GPO_HIN_VALIDATE WHERE BATCH_NUM = <batch_num> AND (STATUS = 'NO' OR MATCH_TYPE = 'no_match') LIMIT 200"
    - name: address_corrections_for_batch
      description: "USPS address corrections applied in a batch"
      sql: "SELECT BATCH_NUM, ORIGINAL_NAME, ORIGINAL_STREET, ORIGINAL_CITY, ORIGINAL_STATE, ORIGINAL_POSTAL_CODE, UPDATED_STREET, UPDATED_CITY, UPDATED_STATE, UPDATED_POSTAL_CODE, PLUS_4_CODE, ACTION FROM GPO_USPS_VALIDATE WHERE BATCH_NUM = <batch_num> AND (ORIGINAL_STREET <> UPDATED_STREET OR ORIGINAL_POSTAL_CODE <> UPDATED_POSTAL_CODE) LIMIT 200"
    - name: cot_discrepancies_for_batch
      description: "Records where the corrected Class of Trade differs from the submitted one"
      sql: "SELECT BATCH_NUM, CUSTOMER_NAME, ORIGINAL_COT, HIBCC_COT, DEA_COT, RODB_COT, CORRECTED_COT FROM GPO_COT_VALIDATE WHERE BATCH_NUM = <batch_num> AND CORRECTED_COT <> ORIGINAL_COT LIMIT 200"
    - name: member_match_summary
      description: "Membership match outcomes for a batch, by criteria"
      sql: "SELECT STATUS, MATCHING_CRITERIA, COUNT(*) AS record_count FROM GPO_MEMBER_VALIDATE WHERE BATCH_NUM = <batch_num> GROUP BY STATUS, MATCHING_CRITERIA ORDER BY record_count DESC"
    - name: final_output_for_batch
      description: "Final formatted output rows for a batch"
      sql: "SELECT KEYNUM, BATCH_NUM, NAME, CORRECTED_HIN, CORRECTED_DEA, CORRECTED_HRSA, STATUS, HIBCC_COT, DEA_COT, RODB_COT, MN_COT, CORRECTED_STREET, CORRECTED_CITY, CORRECTED_STATE, CORRECTED_POSTAL_CODE, MEMBER_MATCHING_CRITERIA FROM GPO_CUST_OUTPUT WHERE BATCH_NUM = <batch_num> LIMIT 200"
    - name: batches_awaiting_output
      description: "Batches fully validated but with no output generated yet"
      sql: "SELECT BATCH_NUM, FILE_NAME, CREATED_DATE, CURRENT_ACTION FROM GPO_CUST_HDR WHERE isOutputGenerated = 0 AND HIN_VALIDATED = 1 AND DEA_VALIDATED = 1 AND USPS_VALIDATED = 1 AND COT_VALIDATED = 1 ORDER BY CREATED_DATE DESC"
    - name: batch_audit_trail
      description: "Audit trail for a batch, newest first"
      sql: "SELECT BATCH_NUM, USER_ACTION, action_desc, CREATED_DATE, CREATED_BY FROM GPO_LOGS WHERE BATCH_NUM = <batch_num> ORDER BY CREATED_DATE DESC LIMIT 200"
    - name: action_volume_summary
      description: "Most frequent audit actions across all batches"
      sql: "SELECT USER_ACTION, COUNT(*) AS action_count FROM GPO_LOGS GROUP BY USER_ACTION ORDER BY action_count DESC"
    - name: role_permission_matrix
      description: "Roles with their CRUD permissions"
      sql: "SELECT r.ROLE_ID, r.ROLE, r.DESCRIPTION, p.CAN_VIEW, p.CAN_ADD, p.CAN_EDIT, p.CAN_DELETE FROM GPO_ROLE_MASTER r LEFT JOIN GPO_ROLE_PERMISSION p ON r.ROLE_ID = p.ROLE_ID ORDER BY r.ROLE_ID"
    - name: users_by_role
      description: "Users assigned to each role"
      sql: "SELECT r.ROLE, m.USER_ID, m.USERNAME, m.EMAIL, m.STATUS, m.ASSIGNED_DATE FROM GPO_ROLE_MAPPING m JOIN GPO_ROLE_MASTER r ON m.ROLE_ID = r.ROLE_ID ORDER BY r.ROLE, m.USERNAME"
    - name: recent_logins
      description: "Most recent login sessions with the user's role"
      sql: "SELECT l.USER_ID, m.USERNAME, r.ROLE, l.LOGIN_TIME, l.EXPIRY_TIME, l.STATUS FROM GPO_USER_LOGIN l LEFT JOIN GPO_ROLE_MAPPING m ON l.USER_ID = m.USER_ID LEFT JOIN GPO_ROLE_MASTER r ON m.ROLE_ID = r.ROLE_ID ORDER BY l.LOGIN_TIME DESC LIMIT 50"
    - name: members_with_organization_ids
      description: "Members with their organization identifiers"
      sql: "SELECT m.MEMBER_ID, m.MEMBER_NAME, m.MEMBER_GRP_NAME, o.TYPE, o.IDENTIFIER, o.PRIMARY_FLAG, o.START_DATE, o.END_DATE FROM MN_MEMBER m LEFT JOIN MN_ORGANIZATION_ID o ON m.MEMBER_ID = o.MEMBER_ID ORDER BY m.MEMBER_NAME"
    - name: eligible_customers_latest
      description: "Current eligible-customer records per member"
      sql: "SELECT m.MEMBER_ID, m.MEMBER_NAME, c.ELIGIBLE_CUSTOMER_ID, c.START_DATE, c.END_DATE, c.INC_FLAG FROM MN_CF_ELIGIBLE_CUSTOMER c JOIN MN_MEMBER m ON c.MEMBER_ID = m.MEMBER_ID WHERE c.IS_LATEST_ELIGIBILITY = 1 ORDER BY m.MEMBER_NAME"
    - name: contracts_by_document
      description: "Structured contracts with their parent document"
      sql: "SELECT d.STRUCT_DOC_ID, d.STRUCT_DOC_NAME, c.STRUCT_CTRT_ID, c.CTRT_DOC_STATUS, c.STRUCT_DOC_TYPE, c.CTRT_SUB_TYPE, c.CONTRACT_TERM, c.DATE_APPROVED, c.DATE_IMPLEMENTED FROM MN_STRUCTURED_CONTRACT c JOIN MN_STRUCTURED_DOC d ON c.STRUCT_DOC_ID = d.STRUCT_DOC_ID ORDER BY d.STRUCT_DOC_NAME"
    - name: membership_hierarchy
      description: "GPO membership parent/child hierarchy"
      sql: "SELECT GPO_ID, GPO_NAME, GRAND_PARENT_ID, GRAND_PARENT_NAME, PARENT_ID, PARENT_NAME, CHILD_ID, CHILD_NAME FROM GPO_MEMBERSHIP_HEIRARCHY ORDER BY GPO_NAME LIMIT 200"
