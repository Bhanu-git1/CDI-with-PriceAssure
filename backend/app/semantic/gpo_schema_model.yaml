# ============================================================
# GPO CUSTOMER ROSTER VALIDATION — SEMANTIC LAYER (DB 2)
# ============================================================
# GENERATED FILE — do not edit by hand.
#   Regenerate with:
#     python -m scripts.introspect_gpo
#     python -m scripts.build_gpo_semantic_model
#
# Columns, types and row counts are read from the live database, so they
# are accurate by construction. Business knowledge (domains, joins,
# mapping rules, measures) is curated in
# scripts/build_gpo_semantic_model.py.
# ============================================================
version: 2
semantic_model:
  name: gpo_customer_roster_validation
  description: >
    Semantic layer for the GPO customer-roster validation platform (72 tables in schema 'gpo'). A batch of customer records is uploaded, staged, mapped to a standard shape, validated against HIN / DEA / HRSA / USPS master data plus Class-of-Trade and membership matching, then merged and formatted into a final output file. Every stage is status-tracked and audit-logged. The schema also holds membership/contract reference data, role-based access control, and three client-specific parallel pipelines (REG, Abbott, Eisai).

  # ============================================================
  # PARALLEL PROGRAM PIPELINES — pick the right table prefix
  # ============================================================
  programs:
    - id: gpo
      table_prefix: "GPO_"
      table_count: 27
      note: >
        Base/default program. Use these tables unless the user names another program.
    - id: reg
      table_prefix: "REG_"
      table_count: 13
      note: >
        REG program. Mirrors the GPO_* pipeline shape.
    - id: abbott
      table_prefix: "ABBOTT_"
      table_count: 10
      note: >
        Abbott program. Customer LEH flow; uses ABBOTT_CYCLIC_VALIDATE and ABBOTT_PARENT_VALIDATE instead of HIN/DEA/USPS validators.
    - id: eisai
      table_prefix: "EISAI_"
      table_count: 9
      note: >
        Eisai program. Roster change tracking (additions/removals/changes), not validation.

  # ============================================================
  # DOMAINS — business grouping, and the prompt-trimming index
  # ============================================================
  domains:
    - name: rbac_security
      purpose: >
        Roles, CRUD permissions, user-role assignment and login/token sessions
      tables: [GPO_ROLE_MASTER, GPO_ROLE_PERMISSION, GPO_ROLE_MAPPING, GPO_USER_LOGIN]
      keywords: ["role", "roles", "permission", "permissions", "rbac", "login", "logins", "token", "user access", "who can", "admin", "analyst", "session"]
    - name: membership_contract
      purpose: >
        Member, organization identifier, eligible customer, structured document and contract data
      tables: [MN_MEMBER, MN_ORGANIZATION_ID, MN_ORGANIZATION_ID_ASTELLAS, MN_CF_ELIGIBLE_CUSTOMER, MN_STRUCTURED_DOC, MN_STRUCTURED_CONTRACT]
      keywords: ["member", "members", "membership", "organization", "org id", "identifier", "eligible customer", "eligibility", "contract", "contracts", "structured doc", "structured contract", "astellas"]
    - name: customer_upload
      purpose: >
        Batch file upload, raw staging and standardized customer input
      tables: [GPO_CUST_HDR, GPO_STAGED_INPUT, GPO_CUST_INPUT, GPO_INPUT_FORMAT]
      keywords: ["upload", "uploaded", "batch", "batches", "batch_num", "batch number", "file", "files", "roster", "staged", "staging", "input format", "customer input", "batch header", "record count"]
    - name: hin_validation
      purpose: >
        HIN master lookup and HIN validation results
      tables: [GPO_HIN, GPO_HIN_VALIDATE]
      keywords: ["hin", "hibcc", "health industry number"]
    - name: dea_validation
      purpose: >
        DEA master lookup and DEA validation results
      tables: [GPO_DEA, GPO_DEA_VALIDATE]
      keywords: ["dea", "drug enforcement"]
    - name: hrsa_validation
      purpose: >
        HRSA master lookup and HRSA validation results (340B)
      tables: [GPO_HRSA, GPO_HRSA_VALIDATE]
      keywords: ["hrsa", "340b"]
    - name: address_validation
      purpose: >
        USPS address standardisation and correction
      tables: [GPO_USPS, GPO_USPS_VALIDATE]
      keywords: ["usps", "address", "addresses", "street", "city", "postal", "zip", "plus 4", "plus_4"]
    - name: cot_validation
      purpose: >
        Class-of-Trade validation, derived by reconciling HIN, DEA and RODB COT values
      tables: [GPO_COT_VALIDATE]
      keywords: ["cot", "class of trade", "hibcc_cot", "dea_cot", "rodb_cot", "trade class"]
    - name: member_validation
      purpose: >
        Membership matching and identifier/address completeness checks
      tables: [GPO_MEMBER_VALIDATE]
      keywords: ["member validation", "member match", "matching criteria", "mismatch", "member validate"]
    - name: output_processing
      purpose: >
        Merge of all validation results into staged output, then the final formatted output
      tables: [GPO_CUST_STG_OUTPUT, GPO_CUST_OUTPUT, GPO_OUTPUT_FORMAT]
      keywords: ["output", "outputs", "final output", "staged output", "stg output", "deliverable", "output format", "generated file", "corrected"]
    - name: job_tracking
      purpose: >
        Per-stage processing status and progress for each batch
      tables: [GPO_VALIDATION_JOBS, GPO_CUST_HDR]
      keywords: ["job", "jobs", "status", "progress", "stage", "stages", "pending", "failed", "completed", "in-progress", "processing time", "validation job"]
    - name: audit_log
      purpose: >
        Central audit trail — every module writes an action row here
      tables: [GPO_LOGS]
      keywords: ["log", "logs", "gpo logs", "user action", "action_desc", "audit trail", "who did", "history of actions", "activity"]
    - name: configuration
      purpose: >
        Administrative matching thresholds and membership file configuration
      tables: [GPO_ADMIN_VALIDATION_CONFIG, GPO_MEMBERSHIP_FORMAT, GPO_MEMBERSHIP_HDR, GPO_MEMBERSHIP_HEIRARCHY]
      keywords: ["config", "configuration", "threshold", "similarity", "matching percentage", "membership format", "membership header", "hierarchy", "heirarchy", "gpo hierarchy", "parent", "grandparent", "child"]
    - name: reference_data
      purpose: >
        Supporting reference, display-message and mail monitoring data
      tables: [BUID, BUTYPE, DISPLAY_MSG, MAIL_MONITOR, TTBC]
      keywords: ["buid", "butype", "business unit", "display message", "msg", "mail monitor", "ttbc", "reference data"]
    - name: program_reg
      purpose: >
        REG program's own copy of the upload/validate/output pipeline
      tables: [REG_CUST_HDR, REG_CUST_INPUT, REG_STAGED_INPUT, REG_CUST_STG_OUTPUT, REG_CUST_OUTPUT, REG_HIN_VALIDATE, REG_DEA_VALIDATE, REG_USPS_VALIDATE, REG_VALIDATION_JOBS, REG_LOGS, REG_INPUT_FORMAT, REG_OUTPUT_FORMAT, REG_REPORT_FORMAT]
      keywords: ["reg", "reg program", "reg batch", "reg pipeline"]
    - name: program_abbott
      purpose: >
        Abbott program: customer LEH pipeline, cyclic and parent validation
      tables: [ABBOTT_CUST_HDR, ABBOTT_CUSTOMER_LEH_INPUT, ABBOTT_CUSTOMER_LEH_STG_INPUT, ABBOTT_CUSTOMER_LEH_STG_OUTPUT, ABBOTT_CUSTOMER_LEH_OUTPUT, ABBOTT_CYCLIC_VALIDATE, ABBOTT_PARENT_VALIDATE, ABBOTT_LOGS, ABBOTT_MN_MEMBER, ABBOTT_MN_CMTY_EDGE]
      keywords: ["abbott", "leh", "cyclic", "parent validate", "community edge", "cmty"]
    - name: program_eisai
      purpose: >
        Eisai program: GPO roster change-tracking (additions, removals, address, identifier and hierarchy changes)
      tables: [EISAI_CUST_HDR, EISAI_STAGED_INPUT, EISAI_GPO_ROSTER, EISAI_ADDITIONS, EISAI_REMOVALS, EISAI_ADDRESS_CHANGES, EISAI_IDENTIFIER_CHANGES, EISAI_MEMBERSHIP_HEIRARCHY_CHANGES, EISAI_INPUT_FORMAT]
      keywords: ["eisai", "additions", "removals", "address changes", "identifier changes", "roster changes", "gpo roster"]

